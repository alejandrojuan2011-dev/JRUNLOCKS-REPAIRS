:root{--bg:#070a0d;--surface:#10151a;--surface2:#151c22;--line:#253039;--text:#f5f7f8;--muted:#aab5bc;--green:#7cff3b;--green2:#43d615;--shadow:0 18px 50px rgba(0,0,0,.35)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
.site-header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,72px);position:sticky;top:0;z-index:20;background:rgba(7,10,13,.88);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:11px}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--green);color:#071007;font-weight:900;font-size:20px;box-shadow:0 0 25px rgba(124,255,59,.25)}.brand strong{display:block;font-size:15px;letter-spacing:.12em}.brand small{display:block;color:var(--green);font-weight:700;letter-spacing:.15em;font-size:10px}.site-header nav{display:flex;align-items:center;gap:28px;font-size:14px;font-weight:600}.site-header nav>a:hover{color:var(--green)}.nav-cta{padding:10px 16px;border:1px solid var(--green);border-radius:10px;color:var(--green)}
main{max-width:1440px;margin:auto}.hero{min-height:610px;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;padding:72px clamp(24px,6vw,90px);overflow:hidden;position:relative;background:radial-gradient(circle at 77% 40%,rgba(124,255,59,.15),transparent 27%)}.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(to right,transparent,black)}.hero-copy,.hero-art{position:relative;z-index:1}.eyebrow{display:inline-block;color:var(--green);font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;margin-bottom:16px}.hero h1{font-size:clamp(44px,6vw,82px);line-height:1.02;letter-spacing:-.055em;margin:0 0 24px;max-width:780px}.hero p{font-size:18px;color:var(--muted);max-width:650px;margin:0 0 30px}.hero-actions{display:flex;gap:14px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;padding:14px 20px;border-radius:12px;font-weight:800;font-size:14px}.primary{background:var(--green);color:#081008;box-shadow:0 12px 30px rgba(124,255,59,.16)}.primary:hover{background:#91ff5c}.secondary{background:transparent;border:1px solid var(--line)}.secondary:hover{border-color:var(--green);color:var(--green)}.trust-row{display:flex;gap:22px;flex-wrap:wrap;color:#cbd3d8;font-size:13px;margin-top:30px}.hero-art img{width:min(590px,100%);margin:auto;filter:drop-shadow(0 35px 45px rgba(0,0,0,.5))}
.catalog-section{padding:95px clamp(24px,6vw,90px)}.section-heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:32px}.section-heading h2,.service-banner h2{font-size:clamp(32px,4vw,52px);line-height:1.1;letter-spacing:-.04em;margin:0}.result-count{color:var(--muted);font-size:14px}.toolbar{display:grid;grid-template-columns:1fr 230px 230px;gap:12px;margin-bottom:28px}.search-box{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}.search-box input,.toolbar select{width:100%;height:48px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;outline:none}.search-box input{border:0;background:transparent;padding:0}.search-box:focus-within,.toolbar select:focus{border-color:var(--green)}
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.product-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.25s;display:flex;flex-direction:column}.product-card:hover{transform:translateY(-5px);border-color:#3b4a54;box-shadow:var(--shadow)}.product-image-wrap{height:260px;background:linear-gradient(145deg,#182128,#0c1014);position:relative;display:grid;place-items:center;overflow:hidden}.product-image{width:88%;height:88%;object-fit:contain;transition:.35s}.product-card:hover .product-image{transform:scale(1.04)}.product-badge{position:absolute;z-index:2;top:14px;left:14px;border-radius:999px;background:var(--green);color:#071007;padding:6px 10px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}.product-body{padding:20px;display:flex;flex-direction:column;flex:1}.category{color:var(--green);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.product-body h3{font-size:19px;line-height:1.25;margin:8px 0 10px}.product-body p{color:var(--muted);font-size:13px;margin:0 0 20px;flex:1}.product-bottom{border-top:1px solid var(--line);padding-top:17px;display:flex;align-items:end;justify-content:space-between;gap:10px}.price-wrap{display:flex;flex-direction:column}.old-price{text-decoration:line-through;color:#78858e;font-size:12px}.price{font-size:23px;line-height:1.1}.price.quote{font-size:18px;color:var(--green)}.order-button{background:#202a31;border:1px solid #33414a;padding:10px 15px;border-radius:10px;font-size:13px;font-weight:800}.order-button:hover{background:var(--green);color:#071007;border-color:var(--green)}.empty-state{text-align:center;padding:60px;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
.service-banner{margin:20px clamp(24px,6vw,90px) 70px;padding:45px;display:flex;align-items:center;justify-content:space-between;gap:30px;border-radius:24px;background:linear-gradient(120deg,#17231b,#10161a 70%);border:1px solid #29402c}.service-banner p{color:var(--muted);margin:14px 0 0;max-width:730px}.contact-grid{padding:0 clamp(24px,6vw,90px) 90px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.contact-grid article{display:flex;gap:15px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}.contact-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:rgba(124,255,59,.1);color:var(--green);font-weight:900}.contact-grid small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.contact-grid a{font-size:13px;font-weight:700;word-break:break-word}.contact-grid a:hover{color:var(--green)}
footer{border-top:1px solid var(--line);padding:30px clamp(24px,6vw,90px);display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.footer-brand{color:var(--text)}.floating-wa{position:fixed;right:22px;bottom:22px;width:55px;height:55px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#071007;font-weight:900;box-shadow:0 14px 35px rgba(0,0,0,.45);z-index:25}
@media(max-width:1000px){.hero{grid-template-columns:1fr;padding-top:90px}.hero-art{max-width:620px;margin:35px auto 0}.product-grid{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.search-box{grid-column:1/-1}.contact-grid{grid-template-columns:1fr}.service-banner{align-items:flex-start;flex-direction:column}}
@media(max-width:650px){.site-header{height:68px;padding:0 16px}.site-header nav>a:not(.nav-cta){display:none}.hero{padding:64px 20px}.hero h1{font-size:44px}.hero p{font-size:16px}.catalog-section{padding:70px 18px}.section-heading{align-items:start;gap:12px;flex-direction:column}.toolbar{grid-template-columns:1fr}.search-box{grid-column:auto}.product-grid{grid-template-columns:1fr}.product-image-wrap{height:245px}.service-banner{margin:0 18px 55px;padding:28px}.contact-grid{padding:0 18px 65px}footer{align-items:flex-start;gap:18px;flex-direction:column}.trust-row{gap:12px}.hero-actions .button{width:100%}}
